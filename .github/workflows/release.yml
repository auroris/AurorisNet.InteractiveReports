name: Release

run-name: Release ${{ inputs.version || format('(next {0})', inputs.bump) }}${{ inputs.dry-run && ' (dry run)' || '' }}

# Publishes the five packages to nuget.org and GitHub. Starts by hand, or from the CI workflow when a Dependabot update
# of a shipped package has passed the tests. The shared steps come from auroris/AurorisNet.Build, whose
# docs/releasing.md describes them. nuget.org trusts this file by its name, so keep it release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 1.2.3 or 1.2.3-rc.1. Leave empty to raise the newest release tag.
        required: false
        type: string
      bump:
        description: Which part of the newest stable tag to raise when the version is empty
        type: choice
        default: patch
        options:
          - patch
          - minor
      test:
        description: Run the tests before publishing. The automated runs turn this off, because they have just run them.
        type: boolean
        default: true
      dry-run:
        description: Build, test and pack only, and keep the packages as an artifact
        type: boolean
        default: false
      notes:
        description: Notes for the GitHub release, in Markdown, shown above the generated list of changes
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      ContinuousIntegrationBuild: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Choose the version
        id: version
        uses: auroris/AurorisNet.Build/actions/version@main
        with:
          version: ${{ inputs.version }}
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}

      - name: Install client dependencies
        run: npm ci

      # The packaged help page is built with screenshots that Chromium takes.
      - name: Install the browser for the packaged help screenshots
        run: npx playwright install chromium

      # scripts/release.ps1 builds the browser bundles and help page, runs the client unit tests and the Core and
      # ASP.NET Core test projects unless told to skip them, packs the five packages with their symbols, and writes
      # SHA256SUMS.txt beside them in releases/<version>.
      - name: Build, test and pack
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RUN_TESTS: ${{ inputs.test }}
        run: ./scripts/release.ps1 -Version $env:RELEASE_VERSION -SkipInstall -SkipTests:($env:RUN_TESTS -ne 'true')

      - name: Check the documentation
        if: ${{ inputs.test }}
        run: npm run test:docs

      - name: Publish
        uses: auroris/AurorisNet.Build/actions/publish@main
        with:
          versions: ${{ steps.version.outputs.versions }}
          packages: releases/${{ steps.version.outputs.version }}
          assets: releases/${{ steps.version.outputs.version }}/SHA256SUMS.txt
          dry-run: ${{ inputs.dry-run }}
          notes: ${{ inputs.notes }}
