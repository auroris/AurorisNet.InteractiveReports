name: Release NuGet packages

run-name: Release ${{ inputs.version || format('(next {0})', inputs.bump) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.3 or 1.0.3-rc.1; optional v prefix). Leave blank to bump the latest stable v* tag.'
        required: false
        type: string
      bump:
        description: 'Which part of the latest stable tag to bump when version is blank'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
      publish_to_nuget:
        description: 'Also publish the packages to nuget.org'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and reject existing tags
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          $version = ([string] $env:RELEASE_VERSION).Trim()
          if (-not $version) {
            # No version given (the CI workflow dispatches releases this way): bump the
            # highest stable v<major>.<minor>.<patch> tag. Prerelease tags are skipped.
            $tags = git tag --list 'v*'
            if ($LASTEXITCODE -ne 0) { throw 'Could not list tags.' }
            $latest = @($tags) |
              Where-Object { $_ -cmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' } |
              ForEach-Object { [version]$_.Substring(1) } |
              Sort-Object -Descending |
              Select-Object -First 1
            if (-not $latest) { throw 'No stable vMAJOR.MINOR.PATCH tag exists to bump. Enter a version.' }
            $version = switch ($env:RELEASE_BUMP) {
              'minor' { "$($latest.Major).$($latest.Minor + 1).0" }
              'patch' { "$($latest.Major).$($latest.Minor).$($latest.Build + 1)" }
              default { throw "Unknown bump '$($env:RELEASE_BUMP)'. Use patch or minor." }
            }
            Write-Host "Bumping $env:RELEASE_BUMP from v$latest to v$version"
          }
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          $number = '(0|[1-9][0-9]*)'
          $identifier = '(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ($version -cnotmatch "\A$number\.$number\.$number(-$identifier(\.$identifier)*)?\z") {
            throw 'Use MAJOR.MINOR.PATCH, optionally followed by a prerelease such as -rc.1. Build metadata is not supported.'
          }
          foreach ($component in $version.Split('-', 2)[0].Split('.')) {
            if ($component.Length -gt 5 -or [int]$component -gt 65534) {
              throw '.NET assembly version components must be between 0 and 65534.'
            }
          }
          $tag = "v$version"
          $existingTag = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing tags.' }
          if ($existingTag) { throw "Tag $tag already exists. Choose a new version." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build:
    name: Build, test, and pack
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ContinuousIntegrationBuild: 'true'
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install client dependencies
        run: npm ci

      - name: Install browser for packaged help screenshots
        run: npx playwright install chromium

      - name: Build release packages
        run: ./scripts/release.ps1 -Version $env:RELEASE_VERSION -SkipInstall

      - name: Check documentation
        run: npm run test:docs

      - name: Upload packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-${{ needs.prepare.outputs.version }}
          path: releases/${{ needs.prepare.outputs.version }}/*
          if-no-files-found: error

  github_release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-${{ needs.prepare.outputs.version }}
          path: packages

      - name: Verify checksums
        working-directory: packages
        run: sha256sum --check SHA256SUMS.txt

      - name: Create release with packages and symbols
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # The prepare job rejected an existing tag; one appearing since then means another
          # process claimed this version during the build.
          if tagged_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null); then
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG points to a different commit. Choose a new version."
              exit 1
            fi
          fi
          flags=()
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" packages/*.nupkg packages/*.snupkg packages/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "AurorisNet.InteractiveReports $RELEASE_VERSION" \
            --generate-notes "${flags[@]}"

  nuget:
    name: Publish to nuget.org
    needs: [prepare, github_release]
    if: ${{ inputs.publish_to_nuget }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-${{ needs.prepare.outputs.version }}
          path: packages

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify checksums
        working-directory: packages
        run: sha256sum --check SHA256SUMS.txt

      - name: Log in to nuget.org with Trusted Publishing
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: AurorisNet

      - name: Publish packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate
