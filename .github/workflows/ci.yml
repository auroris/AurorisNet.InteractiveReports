name: CI

# Tests each pull request, and merges a Dependabot update that passes. An update of a package that a project under src
# references, or of an npm package that is bundled into the UI, ships in the next weekly release.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # The same pipeline as the Release workflow (scripts/release.ps1 wraps scripts/pack.ps1), on the same operating
  # system, without a version: build the browser bundles and packaged help, run the client unit tests and the Core and
  # ASP.NET Core test projects, pack the five packages, then run the browser-server and documentation tests. The
  # live-database suite needs the IR_TEST_* connection strings and skips itself here.
  test:
    name: Build, test and pack
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ContinuousIntegrationBuild: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install client dependencies
        run: npm ci

      # The packaged help page is built with screenshots that Chromium takes.
      - name: Install the browser for the packaged help screenshots
        run: npx playwright install chromium

      - name: Build, test and pack
        run: ./scripts/pack.ps1 -SkipInstall

      - name: Browser-server tests
        run: npm run test:server

      - name: Check the documentation
        run: npm run test:docs

  # A workflow that runs for Dependabot gets a read-only token unless the job asks for more.
  dependabot:
    name: Merge Dependabot update
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The browser bundles and packaged help are built from npm packages and embedded in AurorisNet.InteractiveReports.
      # Test tooling and the in-browser demo's database are not shipped.
      - uses: auroris/AurorisNet.Build/actions/dependabot-release@main
        with:
          npm-ships: 'true'
          npm-development-only: '@playwright/test,playwright,happy-dom,sql.js'
