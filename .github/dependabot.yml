# Dependabot opens the pull requests that .github/workflows/ci.yml tests and merges. An update of a shipped package then
# starts the Release workflow, as docs/releasing.md in auroris/AurorisNet.Build describes.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      # The .NET platform packages are the primary dependency: the Microsoft.Extensions.*
      # packages ship inside the libraries, and the rest move with them in the monthly .NET
      # servicing release. They get their own pull request, so each servicing release
      # becomes its own package release.
      dotnet:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Data.Sqlite"
          - "System.*"
        update-types:
          - minor
          - patch
      # GraphQL.NET backs the GraphQL client adapter (shipped) and the Workbench's GraphiQL
      # page (not shipped); the two packages must move together.
      graphql:
        patterns:
          - "GraphQL*"
        update-types:
          - minor
          - patch
      # Test-only packages never reach consumers, so merging them does not create a release.
      test-dependencies:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
          - "Microsoft.Data.SqlClient"
          - "Npgsql*"
          - "Oracle.ManagedDataAccess*"
        update-types:
          - minor
          - patch
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Data.Sqlite"
          - "System.*"
          - "GraphQL*"
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
          - "Microsoft.Data.SqlClient"
          - "Npgsql*"
          - "Oracle.ManagedDataAccess*"
        update-types:
          - minor
          - patch
    ignore:
      # Stay on the .NET major the libraries are written against (a new major means a new
      # .NET release and a deliberate target-framework upgrade). Major updates of other
      # packages still open pull requests, but CI leaves them for manual review.
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "System.*"
        update-types:
          - "version-update:semver-major"

  # The browser bundles and packaged help page are built from these packages and embedded
  # in AurorisNet.InteractiveReports, so client updates ship like NuGet updates do.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Playwright drives the browser suite and the documentation screenshots; happy-dom
      # hosts the DOM unit tests. Neither is part of a package.
      test-tooling:
        patterns:
          - "@playwright/test"
          - "playwright*"
          - "happy-dom"
        update-types:
          - minor
          - patch
      # sql.js only runs the standalone in-browser demo.
      demo:
        patterns:
          - "sql.js"
        update-types:
          - minor
          - patch
      # Everything else is bundled into the packaged UI or builds the packaged help page.
      client:
        patterns:
          - "*"
        exclude-patterns:
          - "@playwright/test"
          - "playwright*"
          - "happy-dom"
          - "sql.js"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
